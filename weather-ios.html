<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a6fd6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>آب‌وهوای قندیل</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@200;400;600&display=swap" rel="stylesheet">
<style>
:root{--top:#2a6fd6;--bot:#79b8f5}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
@font-face{font-family:SysEmoji;src:local("Apple Color Emoji"),local("Segoe UI Emoji"),local("Noto Color Emoji"),local("Twemoji Mozilla");unicode-range:U+00A9,U+00AE,U+200D,U+203C-3299,U+FE0F,U+1F000-1FAFF}
body{font-family:SysEmoji,Vazirmatn,-apple-system,system-ui,sans-serif;color:#fff;min-height:100vh;background:linear-gradient(180deg,var(--top),var(--bot)) fixed;transition:background .6s;overscroll-behavior-y:contain}
.wrap{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 40px}
.search{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border-radius:12px;padding:0 10px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.search-area{position:relative;z-index:120;margin-bottom:18px}
#sug{position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:9999;display:block;list-style:none;margin:0;padding:6px 0;background:rgba(20,30,50,.97);border:1px solid rgba(255,255,255,.16);border-radius:14px;max-height:min(65vh,520px);overflow-y:auto;overscroll-behavior:contain;box-shadow:0 16px 44px rgba(0,0,0,.42);-webkit-overflow-scrolling:touch}
#sug[hidden]{display:none!important}
#sug li{display:flex;flex-direction:column;gap:3px;padding:12px 16px;min-height:52px;border-bottom:1px solid rgba(255,255,255,.10);cursor:pointer;text-align:start;direction:auto;unicode-bidi:plaintext}
#sug li:last-child{border-bottom:0}
#sug li[aria-selected="true"],#sug li:active{background:rgba(255,255,255,.16)}
#sug .r-name{font-size:15px;font-weight:700;line-height:1.55}
#sug .r-alt{font-size:13px;font-weight:500;opacity:.78}
#sug .r-sub{font-size:12px;opacity:.72;line-height:1.5}
#sug li.empty{align-items:center;text-align:center;cursor:default;direction:rtl;opacity:.85}

.search input{flex:1;min-width:0;background:none;border:0;color:#fff;font:inherit;font-size:16px;padding:10px 0;outline:none}
.search input::placeholder{color:rgba(255,255,255,.65)}
.search button{background:none;border:0;font-size:18px;cursor:pointer;padding:4px;color:#fff;transition:opacity .15s,transform .15s}
.search button:hover{opacity:.8}
.search button:active{transform:scale(.9)}
.search button.spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.search button.on{color:#ffe082;text-shadow:0 0 8px rgba(255,224,130,.6)}

/* وضعیت آنلاین/آفلاین */
.status-dot{width:10px;height:10px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80;animation:pulse-green 2s infinite;flex-shrink:0;margin-right:4px}
.status-dot.offline{background:#ef4444;box-shadow:0 0 8px #ef4444;animation:pulse-red 2s infinite}
@keyframes pulse-green{0%{box-shadow:0 0 0 0 rgba(74,222,128,.7)}70%{box-shadow:0 0 0 6px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
@keyframes pulse-red{0%{box-shadow:0 0 0 0 rgba(239,68,68,.7)}70%{box-shadow:0 0 0 6px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}

#sug{position:relative;z-index:80;width:100%;list-style:none;padding:0;margin-top:8px;background:rgba(20,30,50,.72);border-radius:14px;overflow:hidden;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);max-height:55vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.35)}
#sug li{padding:11px 16px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:2px;transition:background .15s;text-align:left;direction:ltr}
#sug li:hover,#sug li:focus{background:rgba(255,255,255,.12)}
#sug li:last-child{border:0}
#sug li .r-name{font-size:15px;font-weight:600;line-height:1.6;unicode-bidi:plaintext}#sug li .r-alt{font-size:13px;font-weight:500;opacity:.78}
#sug li .r-sub{font-size:12px;opacity:.7;line-height:1.4}
#sug li.empty{cursor:default;text-align:center;direction:rtl;opacity:.7;padding:18px;justify-content:center;align-items:center}
#sug li.empty:hover{background:transparent}

:focus-visible{outline:2px solid #fff;outline-offset:2px;border-radius:8px}
.h i,.day .i{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",SysEmoji,sans-serif;font-variant-emoji:emoji;font-style:normal}
.mini{position:fixed;top:0;left:0;right:0;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 0 10px;opacity:0;pointer-events:none;z-index:5;background:linear-gradient(var(--top),transparent);font-weight:600}
.mini small{display:block;font-weight:400;font-size:13px;opacity:.9}
.hero{text-align:center;padding:44px 0 34px}
.city{font-size:32px;font-weight:400}
.city-sub{font-size:13px;opacity:.75;margin-top:2px}
.temp{font-size:104px;font-weight:200;line-height:1.1;margin-top:2px;padding-right:.2em}
.cond{font-size:20px;font-weight:600;text-shadow:0 1px 8px rgba(0,0,0,.12)}
.hl{font-size:18px;margin-top:2px}
.card{background:rgba(255,255,255,.17);border-radius:20px;padding:12px 16px 14px;margin-top:12px;backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3)}
.card h2{font-size:13px;font-weight:600;opacity:.72;margin-bottom:10px;display:flex;gap:6px;align-items:center}
.card h2+.hr{margin:-4px 0 10px;border:0;border-top:1px solid rgba(255,255,255,.2)}
.sum{font-size:14px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.2)}
.scroll{overflow-x:auto;scrollbar-width:none;margin:0 -6px}
.hours{display:flex;min-width:max-content;padding:0 2px}
.h{width:58px;text-align:center;font-size:14px;font-weight:600}
.h i{display:block;font-style:normal;font-size:24px;margin:8px 0 6px}
.h span{font-weight:400;opacity:.9}
.day{display:grid;grid-template-columns:62px 30px 36px 1fr 36px;align-items:center;gap:6px;padding:11px 0;border-top:1px solid rgba(255,255,255,.2);font-size:16px}
.day:first-of-type{border:0;padding-top:2px}
.day b{font-weight:600}.day .i{font-size:22px;text-align:center}
.day .lo{opacity:.62;text-align:left;direction:ltr}.day .hi{text-align:right;direction:ltr;font-weight:600}
.bar{height:5px;border-radius:9px;background:rgba(0,0,0,.2);position:relative;direction:ltr}
.bar u{position:absolute;top:0;bottom:0;border-radius:9px}
.bar s{position:absolute;top:-1.5px;width:8px;height:8px;border-radius:50%;background:#fff;border:1.5px solid rgba(0,0,0,.35);margin-left:-4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.grid .card{margin:0;min-height:158px;display:flex;flex-direction:column}
.big{font-size:34px;font-weight:400;line-height:1.2}
.lvl{font-size:19px;font-weight:600}
.note{font-size:13px;margin-top:auto;opacity:.9}
.uv{height:5px;border-radius:9px;margin:10px 0;background:linear-gradient(90deg,#3ec46d,#f5d63d,#f5963d,#e8453c,#a24bd6);position:relative;direction:ltr}
.uv s{position:absolute;top:-1.5px;width:8px;height:8px;border-radius:50%;background:#fff;border:1.5px solid rgba(0,0,0,.3);margin-left:-4px}
.aqi-good{color:#b6f5c1}.aqi-fair{color:#fff3b0}.aqi-moder{color:#ffd8a8}.aqi-poor{color:#ffb0b0}.aqi-vpoor{color:#e0c8ff}
#msg{text-align:center;padding:90px 0;opacity:.9}

.banner-rain{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;margin-top:12px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);background:linear-gradient(135deg,rgba(255,138,61,.32),rgba(255,200,87,.2));border:1px solid rgba(255,180,100,.6);animation:slideDown .4s cubic-bezier(.16,1,.3,1),rainGlow 2s ease-in-out infinite}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
@keyframes rainGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,138,61,.35)}50%{box-shadow:0 0 0 6px rgba(255,138,61,0)}}
.banner-icon{font-size:1.5rem;flex-shrink:0;line-height:1}
.banner-rain .banner-icon{animation:rainShake 1.6s ease-in-out infinite}
@keyframes rainShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.banner-body{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;font-size:13px}
.banner-body b{font-size:13px}
.banner-body span{opacity:.9;line-height:1.5}

.notif-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;margin-top:12px;border-radius:12px;font-size:12px;background:rgba(120,220,160,.16);border:1px solid rgba(120,220,160,.35);transition:background .15s}
.notif-bar.alert{background:rgba(255,160,80,.22);border-color:rgba(255,160,80,.55)}

.pull{position:fixed;top:0;left:50%;transform:translate(-50%,-100px);display:flex;align-items:center;gap:8px;padding:8px 16px;background:rgba(20,30,50,.9);border-radius:20px;font-size:12px;z-index:150;pointer-events:none;transition:transform .25s cubic-bezier(.16,1,.3,1);box-shadow:0 6px 24px rgba(0,0,0,.4);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);white-space:nowrap}
.pull.visible{transform:translate(-50%,calc(env(safe-area-inset-top,0px) + 10px))}
.pull.ready{color:#ffe082}
.pull-spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%}
.pull.ready .pull-spin{border-top-color:#ffe082}
.pull.refreshing .pull-spin{animation:spin .9s linear infinite;border-top-color:#ffe082}

.chart{width:100%;height:150px;display:block;margin-top:4px}
.chart-precip{height:120px}

.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:rgba(20,28,44,.96);padding:12px 20px;border-radius:14px;font-size:13px;opacity:0;transition:opacity .25s,transform .25s;z-index:200;max-width:calc(100% - 32px);text-align:center;line-height:1.6;pointer-events:none;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.success{border:1px solid rgba(74,222,128,.5)}
.toast.error{border:1px solid rgba(239,68,68,.5)}
.toast.info{border:1px solid rgba(120,180,255,.5)}

.notif-stack{position:fixed;top:0;left:0;right:0;z-index:180;display:flex;flex-direction:column;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;pointer-events:none;align-items:center}
.inpage-notif{pointer-events:auto;display:flex;gap:10px;align-items:flex-start;padding:12px 14px 12px 12px;background:rgba(28,32,46,.97);border-radius:14px;box-shadow:0 12px 48px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.08);width:100%;max-width:380px;cursor:pointer;overflow:hidden;animation:notifIn .45s cubic-bezier(.16,1,.3,1);position:relative;border-right:3px solid #ff9a5c}
.inpage-notif.out{animation:notifOut .35s cubic-bezier(.4,0,1,1) forwards}
@keyframes notifIn{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:translateY(0)}}
@keyframes notifOut{to{opacity:0;transform:translateY(-30px)}}
.inpage-notif-icon{font-size:1.6rem;flex-shrink:0;line-height:1}
.inpage-notif-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.inpage-notif-title{font-size:14px;font-weight:700;line-height:1.4}
.inpage-notif-text{font-size:12px;opacity:.9;line-height:1.6}
.inpage-notif-close{background:transparent;border:none;color:rgba(255,255,255,.5);font-size:1.2rem;cursor:pointer;padding:0 4px;line-height:1;flex-shrink:0}
.inpage-notif-close:hover{color:#fff}

footer{text-align:center;font-size:12px;opacity:.75;margin-top:20px;line-height:2}
footer b{font-weight:600;opacity:1}

@media(prefers-reduced-motion:reduce){body{transition:none}}

/* بهینه‌سازی رندر برای WebView گوشی‌های میان‌رده */
@media (max-width:600px){
  .search,#sug,.card,.banner-rain,.pull{
    -webkit-backdrop-filter:none!important;
    backdrop-filter:none!important;
  }
  .search{background:rgba(255,255,255,.25)}
  #sug{background:rgba(20,30,50,.94)}
  .card{background:rgba(255,255,255,.23)}
  .banner-rain{background:rgba(255,160,75,.28)}
  .pull{background:rgba(20,30,50,.96)}
  .status-dot,.status-dot.offline{animation:none;box-shadow:none}
  .banner-rain{animation:slideDown .25s ease-out}
  .banner-rain .banner-icon{animation:none}
}

/* رفع باگ عدم مخفی شدن المان‌ها */
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="pull" id="pull"><div class="pull-spin"></div><span id="pullText">برای به‌روزرسانی بکشید</span></div>
<div class="mini" id="mini"><span id="mc"></span><small id="mt"></small></div>
<div class="notif-stack" id="notifStack"></div>
<div class="wrap">
  <div class="search-area" id="searchArea">
    <form class="search" id="f" autocomplete="off">
      <div class="status-dot" id="statusDot" title="آنلاین"></div>
      <span>🔍</span>
      <input id="q" type="search" lang="fa" dir="auto" inputmode="search" spellcheck="false" maxlength="80" placeholder="جستجوی شهر" autocomplete="off" aria-label="جستجوی شهر" aria-controls="sug" aria-expanded="false">
      <button type="button" id="loc" aria-label="موقعیت من">📍</button>
      <button type="button" id="bell" aria-label="اعلان بارش" title="فعال‌سازی اعلان بارش">🔔</button>
      <button type="button" id="install" aria-label="نصب اپ" title="نصب" hidden>⬇️</button>
      <button type="button" id="refresh" aria-label="به‌روزرسانی" title="به‌روزرسانی">↻</button>
    </form>
    <ul id="sug" role="listbox" aria-label="نتایج جستجوی شهر" hidden></ul>
  </div>

  <div class="banner-rain" id="rainBanner" hidden>
    <span class="banner-icon">🌧️</span>
    <div class="banner-body">
      <b>هشدار بارش</b>
      <span id="rainMsg"></span>
    </div>
  </div>

  <div class="notif-bar" id="notifBar" hidden>
    <span>🔔</span>
    <span id="notifBarText" style="flex:1">—</span>
  </div>

  <div id="msg">در حال دریافت اطلاعات…</div>

  <main id="app" hidden>
    <section class="hero" id="hero">
      <div class="city" id="city"></div>
      <div class="city-sub" id="citySub"></div>
      <div class="temp" id="temp"></div>
      <div class="cond" id="cond"></div>
      <div class="hl" id="hl"></div>
    </section>

    <section class="card"><h2>📈 دمای ۲۴ ساعت آینده</h2><canvas class="chart" id="tempChart"></canvas></section>
    <section class="card"><h2>💧 احتمال بارش ۲۴ ساعت آینده</h2><canvas class="chart chart-precip" id="precipChart"></canvas></section>

    <section class="card"><h2>🕐 پیش‌بینی ساعتی</h2><hr class="hr"><div class="scroll"><div class="hours" id="hours"></div></div></section>
    <section class="card"><h2>📅 پیش‌بینی ۷ روزه</h2><hr class="hr"><div id="days"></div></section>
    <div class="grid" id="stats"></div>

    <footer>
      <div>آخرین به‌روزرسانی: <b id="lastUpdate">—</b></div>
      <div>به‌روزرسانی بعدی تا <b id="countdown">—</b></div>
    </footer>
  </main>
</div>
<div class="toast" id="toast"></div>

const builtinMap = BUILTIN[appLang] || {};
const translationCache = new Map();
const translatedNodes = new WeakSet();
const pendingTranslations = new Set();
let translationTimer = null;
function translateText(text){
  const raw = text.trim();
  if (!raw || appLang === 'fa') return Promise.resolve(text);
  if (builtinMap[raw]) return Promise.resolve(text.replace(raw,builtinMap[raw]));
  if (appLang === 'en' || appLang === 'ar') return Promise.resolve(text);
  if (translationCache.has(raw)) return Promise.resolve(text.replace(raw,translationCache.get(raw)));
  return fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=fa&tl='+encodeURIComponent(appLang)+'&dt=t&q='+encodeURIComponent(raw))
    .then(r=>r.ok?r.json():Promise.reject()).then(data=>{
      const result=(data[0]||[]).map(x=>x[0]||'').join('');
      if(result){translationCache.set(raw,result);try{localStorage.setItem('qandil_tr_'+appLang+'_'+raw,result)}catch(e){};return text.replace(raw,result);}
      return text;
    }).catch(()=>text);
}
function queueTranslation(node){
  if(translatedNodes.has(node)) return;
  const raw=node.nodeValue;
  if(!raw || !raw.trim()) return;
  translatedNodes.add(node);
  pendingTranslations.add(node);
  clearTimeout(translationTimer);
  translationTimer=setTimeout(async()=>{
    const nodes=[...pendingTranslations];pendingTranslations.clear();
    for(let i=0;i<nodes.length;i+=5){
      await Promise.all(nodes.slice(i,i+5).map(async n=>{
        if(!n.isConnected) return;
        const original=n.nodeValue;
        const translated=await translateText(original);
        if(n.isConnected && translated!==original) n.nodeValue=translated;
      }));
    }
  },80);
}
function scanTranslations(root=document.body){
  if(appLang==='fa') return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{
    const p=n.parentElement;
    return p && !p.closest('script,style,textarea,canvas,svg') ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
  }});
  while(walker.nextNode()) queueTranslation(walker.currentNode);
  root.querySelectorAll?.('[placeholder],[aria-label],[title]').forEach(el=>{
    for(const attr of ['placeholder','aria-label','title']){
      const val=el.getAttribute(attr);
      if(val && !el.dataset['tr_'+attr]){el.dataset['tr_'+attr]='1';translateText(val).then(v=>{if(v!==val)el.setAttribute(attr,v);});}
    }
  });
}
function applySystemLanguage(){
  document.documentElement.lang=appLang;
  document.documentElement.dir=(appLang==='fa'||appLang==='ar')?'rtl':'ltr';
  document.title=appLang==='fa'?'آب‌وهوای قندیل':appLang==='ar'?'طقس قنديل':'Qandil Weather';
  if(appLang!=='fa'){
    scanTranslations();
    new MutationObserver(records=>records.forEach(r=>{
      r.addedNodes.forEach(n=>{if(n.nodeType===Node.TEXT_NODE)queueTranslation(n);else if(n.nodeType===Node.ELEMENT_NODE)scanTranslations(n);});
      if(r.type==='characterData') queueTranslation(r.target);
    })).observe(document.body,{subtree:true,childList:true,characterData:true});
  }
}

function tc(t){

  while (i < ST.length-2 && t > ST[i+1][0]) i++;

  const k = Math.max(0, Math.min(1, (t-a)/(b-a)));
  return `rgb(${A.map((v,j)=>Math.round(v+(B[j]-v)*k)).join()})`;
}

function getAudioCtx(){
  if (!audioCtx) { try { audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} }
  return audioCtx;
}
function playNotifSound(){
  const actx = getAudioCtx();
  if (!actx) return;
  const run = () => {
    try {
      const now = actx.currentTime;
      [987.77, 1174.66].forEach((freq, i) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = 'sine'; o.frequency.value = freq;
        o.connect(g); g.connect(actx.destination);
        const s = now + i*0.13;
        g.gain.setValueAtTime(0, s);
        g.gain.linearRampToValueAtTime(0.18, s+0.02);
        g.gain.exponentialRampToValueAtTime(0.001, s+0.7);
        o.start(s); o.stop(s+0.75);
      });
    } catch(e){}
  };
  if (actx.state === 'suspended') actx.resume().then(run).catch(()=>{});
  else run();
}

const notifSupported = () => 'Notification' in window;

function fireNotification(title, body, tag){
  if (!notifEnabled) return false;
  let native = false;
  if (notifSupported() && Notification.permission === 'granted'){
    try {
      const n = new Notification(title, { body, icon:NOTIF_ICON, tag:tag||'w', renotify:true, silent:true });
      n.onclick = () => { try { window.focus(); } catch{} n.close(); };
      native = true;
    } catch(e){}
  }
  if (!native) showInPageNotification(title, body, { icon:'🌧️', duration:10000 });
  else playNotifSound();
  return true;
}

/* ============ Rain logic ============ */
function computeRain(hourly, nowIso){
  const nowHour = nowIso.slice(0, 13);
  let idx = hourly.time.findIndex(t => t.slice(0,13) >= nowHour);
  if (idx < 0) idx = 0;
  const end = Math.min(idx + RAIN_WINDOW_HOURS, hourly.time.length);
  let maxProb = 0, peakIdx = -1;
  for (let i = idx; i < end; i++){
    const p = hourly.precipitation_probability?.[i] ?? 0;
    if (p > maxProb) { maxProb = p; peakIdx = i; }
  }
  return { maxProb, peakIdx, startIdx: idx,
           peakTime: peakIdx >= 0 ? hourly.time[peakIdx] : null };
}

function updateNotifBar(weather){
  if (!notifEnabled || !weather){ $('notifBar').hidden = true; return; }
  const s = computeRain(weather.hourly, weather.current.time);
  const todayProb = weather.daily.precipitation_probability_max?.[0] ?? 0;
  const bar = $('notifBar'), txt = $('notifBarText');
  bar.hidden = false;
  if (s.maxProb >= RAIN_THRESHOLD){
    bar.className = 'notif-bar alert';
    txt.innerHTML = `🌧️ <b>بارش پیش‌بینی‌شده</b> — احتمال ${fa(s.maxProb)}٪ تا ساعت ${dg(s.peakTime.slice(11,16))}`;
  } else if (todayProb >= TODAY_RAIN_THRESHOLD){
    bar.className = 'notif-bar alert';
    txt.innerHTML = `☔ <b>امروز بارانی است</b> — احتمال ${fa(todayProb)}٪ در کل امروز`;

    bar.className = 'notif-bar';
    txt.innerHTML = `در حال پایش — حداکثر بارش ${RAIN_WINDOW_HOURS} ساعت آینده: <b>${fa(s.maxProb)}٪</b> (آستانه ${RAIN_THRESHOLD}٪)`;
  }
}

/* ============ Charts ============ */
function drawTempChart(){
  const cv = $('tempChart');
  const rect = cv.getBoundingClientRect();
  if (!rect.width || !rect.height || !hourly24.temps.length) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width = rect.width * dpr; cv.height = rect.height * dpr;
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const w = rect.width, h = rect.height;
  const pad = { top:14, right:10, bottom:22, left:30 };
  const cw = w - pad.left - pad.right;
  const ch = h - pad.top - pad.bottom;
  ctx.clearRect(0, 0, w, h);

  const temps = hourly24.temps;
  const minT = Math.min(...temps), maxT = Math.max(...temps);
  const span = (maxT - minT) || 1;
  const lo = minT - span*0.2, hi = maxT + span*0.2;
  const n = temps.length;
  const xFor = i => pad.left + (i / Math.max(n-1, 1)) * cw;
  const yFor = t => pad.top + ch - ((t - lo) / (hi - lo)) * ch;

  ctx.strokeStyle = 'rgba(255,255,255,0.14)';
  ctx.lineWidth = 1;
  ctx.font = '10px Vazirmatn, sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  for (let i = 0; i <= 3; i++){
    const y = pad.top + (ch/3) * i;
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(w-pad.right, y); ctx.stroke();
    const val = hi - ((hi-lo)/3) * i;
    ctx.fillText(fa(val)+'°', 4, y);
  }

  const pts = temps.map((t,i) => ({ x: xFor(i), y: yFor(t) }));
  const grad = ctx.createLinearGradient(0, pad.top, 0, pad.top + ch);
  grad.addColorStop(0, 'rgba(255,255,255,0.32)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pad.top + ch);
  pts.forEach(p => ctx.lineTo(p.x, p.y));
  ctx.lineTo(pts[pts.length-1].x, pad.top + ch);
  ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();

  ctx.beginPath();
  pts.forEach((p,i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.4;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.stroke();

  pts.forEach(p => {
    ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.8; ctx.stroke();
  });

  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const step = Math.max(1, Math.ceil(n / 6));
  for (let i = 0; i < n; i += step){
    ctx.fillText(dg(hourly24.times[i].slice(11,16)), xFor(i), h - pad.bottom + 4);
  }
}

function drawPrecipChart(){
  const cv = $('precipChart');
  const rect = cv.getBoundingClientRect();
  if (!rect.width || !rect.height || !hourly24.probs.length) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width = rect.width * dpr; cv.height = rect.height * dpr;
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const w = rect.width, h = rect.height;
  const pad = { top:12, right:10, bottom:22, left:32 };
  const cw = w - pad.left - pad.right;
  const ch = h - pad.top - pad.bottom;
  ctx.clearRect(0, 0, w, h);

  const probs = hourly24.probs;
  const n = probs.length;
  const slotW = cw / n;
  const barW = Math.max(2, slotW - 2);
  const xFor = i => pad.left + i*slotW + (slotW - barW)/2;
  const yFor = p => pad.top + ch - (p/100) * ch;

  ctx.strokeStyle = 'rgba(255,255,255,0.14)';
  ctx.lineWidth = 1;
  ctx.font = '10px Vazirmatn, sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  [0, 25, 50, 75, 100].forEach(lvl => {
    const y = yFor(lvl);
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(w-pad.right, y); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText(dg(lvl)+'٪', 4, y);
  });

  probs.forEach((p, i) => {
    const x = xFor(i), y = yFor(p), bh = pad.top + ch - y;
    if (bh < 1) return;
    const grad = ctx.createLinearGradient(0, y, 0, pad.top + ch);
    const baseA = p >= 70 ? 0.95 : p >= 40 ? 0.75 : p >= 20 ? 0.55 : 0.3;
    grad.addColorStop(0, `rgba(168,213,255,${baseA})`);
    grad.addColorStop(1, 'rgba(168,213,255,0.08)');
    ctx.fillStyle = grad;
    ctx.fillRect(x, y, barW, bh);
  });

  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const step = Math.max(1, Math.ceil(n / 6));
  for (let i = 0; i < n; i += step){
    ctx.fillText(dg(hourly24.times[i].slice(11,16)), xFor(i) + barW/2, h - pad.bottom + 4);
  }
}

function redrawCharts(){
  requestAnimationFrame(() => { drawTempChart(); drawPrecipChart(); });
}

/* ============ Render ============ */
function render(d, aqi, name, savedAt, offline){
  const c = d.current;
  const [txt, ico, k] = w(c.weather_code);
  const sky = SKY[k][c.is_day ? 'd' : 'n'];
  const root = document.documentElement.style;
  root.setProperty('--top', sky[0]);
  root.setProperty('--bot', sky[1]);
  const metaTheme = document.querySelector('meta[name=theme-color]');
  if (metaTheme) metaTheme.content = sky[0];

  const D = d.daily;
  $('city').textContent = name;
  $('citySub').textContent = current.region || '';
  $('temp').textContent = fa(c.temperature_2m) + '°';
  $('cond').textContent = txt;
  $('hl').textContent = `بیشینه ${fa(D.temperature_2m_max[0])}°  کمینه ${fa(D.temperature_2m_min[0])}°`;
  $('mc').textContent = name;
  $('mt').textContent = `${fa(c.temperature_2m)}° | ${txt}`;

  const nowHour = c.time.slice(0, 13);
  let start = d.hourly.time.findIndex(t => t.slice(0,13) === nowHour);
  if (start < 0) start = 0;
  const end = Math.min(start + 24, d.hourly.time.length);
  hourly24 = {
    times: d.hourly.time.slice(start, end),
    temps: d.hourly.temperature_2m.slice(start, end),
    probs: (d.hourly.precipitation_probability || []).slice(start, end)
  };

  $('hours').innerHTML = hourly24.times.map((t, j) => {
    const code = d.hourly.weather_code[start + j];
    return `<div class="h"><span>${j ? dg(+t.slice(11,13)) : 'اکنون'}</span><i>${w(code)[1]}</i>${fa(hourly24.temps[j])}°</div>`;
  }).join('');

  const mn = Math.min(...D.temperature_2m_min), mx = Math.max(...D.temperature_2m_max);
  const sp = (mx - mn) || 1;
  $('days').innerHTML = D.time.map((t, j) => {
    const lo = D.temperature_2m_min[j], hi = D.temperature_2m_max[j];
    const l = (lo - mn)/sp*100, wd = Math.max((hi - lo)/sp*100, 5);
    const dot = j ? '' : `<s style="left:${Math.min(Math.max((c.temperature_2m-mn)/sp*100,0),100)}%"></s>`;
    return `<div class="day"><b>${j ? dayName(new Date(t+'T12:00')) : 'امروز'}</b><span class="i">${w(D.weather_code[j])[1]}</span><span class="lo">${fa(lo)}°</span><div class="bar"><u style="left:${l}%;width:${wd}%;background:linear-gradient(90deg,${tc(lo)},${tc(hi)})"></u>${dot}</div><span class="hi">${fa(hi)}°</span></div>`;
  }).join('');

  const tm = s => dg(+s.slice(11,13)) + ':' + dg(s.slice(14,16));
  const uv = D.uv_index_max[0];
  const ul = uv < 3 ? 'کم' : uv < 6 ? 'متوسط' : uv < 8 ? 'زیاد' : uv < 11 ? 'خیلی زیاد' : 'شدید';
  const ws = c.wind_speed_10m;
  const df = c.apparent_temperature - c.temperature_2m;
  const hm = c.relative_humidity_2m;
  const pr = c.pressure_msl != null ? Math.round(c.pressure_msl) : null;
  const aqiNum = aqi != null ? Math.round(aqi) : null;
  const aqiCls = aqiNum == null ? '' : aqiNum <= 20 ? 'aqi-good' : aqiNum <= 40 ? 'aqi-fair' : aqiNum <= 60 ? 'aqi-moder' : aqiNum <= 80 ? 'aqi-poor' : 'aqi-vpoor';
  const aqiLbl = aqiNum == null ? 'نامشخص' : aqiNum <= 20 ? 'خوب' : aqiNum <= 40 ? 'قابل قبول' : aqiNum <= 60 ? 'متوسط' : aqiNum <= 80 ? 'ناسالم' : 'بسیار ناسالم';

  const cd = (h, body, note) => `<div class="card"><h2>${h}</h2>${body}<div class="note">${note}</div></div>`;
  $('stats').innerHTML =
    cd('☀️ شاخص UV', `<div class="big">${fa(uv)}</div><div class="lvl">${ul}</div><div class="uv"><s style="left:${Math.min(uv/11,1)*100}%"></s></div>`, 'بیشینه امروز') +
    cd('🌇 غروب', `<div class="big">${tm(D.sunset[0])}</div>`, 'طلوع: ' + tm(D.sunrise[0])) +
    cd('💨 باد', `<div class="big">${fa(ws)}</div><div class="lvl">کیلومتر بر ساعت</div>`, ws < 12 ? 'نسیم ملایم' : ws < 30 ? 'باد متوسط' : 'باد قوی') +
    cd('🌡️ حس واقعی', `<div class="big">${fa(c.apparent_temperature)}°</div>`, df > 1 ? 'گرم‌تر از دمای واقعی' : df < -1 ? 'سردتر از دمای واقعی' : 'نزدیک به دمای واقعی') +
    cd('💧 رطوبت', `<div class="big">${fa(hm)}٪</div>`, hm < 30 ? 'هوای خشک' : hm < 60 ? 'رطوبت مطلوب' : 'هوای مرطوب') +
    cd('☔ احتمال بارش', `<div class="big">${fa(D.precipitation_probability_max[0] || 0)}٪</div>`, 'بیشینه امروز') +
    (aqiNum != null ? cd('🌬️ کیفیت هوا', `<div class="big ${aqiCls}">${fa(aqiNum)}</div><div class="lvl ${aqiCls}">${aqiLbl}</div>`, 'شاخص اروپایی (EAQI)') : '') +
    (pr != null ? cd('📊 فشار هوا', `<div class="big">${fa(pr)}</div><div class="lvl">هکتوپاسکال</div>`, pr < 1000 ? 'کم‌فشار' : pr > 1020 ? 'پرفشار' : 'نرمال') : '');

  const upd = new Date(savedAt || Date.now());
  $('lastUpdate').textContent = upd.toLocaleTimeString(localeTag, { hour:'2-digit', minute:'2-digit' }) + (offline ? ' (آفلاین)' : '');

  $('msg').hidden = true;
  $('app').hidden = false;
  redrawCharts();
  onScroll();
  updateNotifBar(d);
  checkRainAlert(d);
}

function onScroll(){
  const p = Math.min(Math.max((scrollY - 70)/110, 0), 1);
  $('mini').style.opacity = p;
  $('hero').style.opacity = 1 - p*0.9;
}
addEventListener('scroll', onScroll, { passive:true });

/* ============ Load ============ */
function showMessage(m){ $('msg').hidden = false; $('msg').textContent = m; $('app').hidden = true; }

function updateStatusDot(isOnline) {
  const dot = $('statusDot');
  if (isOnline) {
    dot.classList.remove('offline');
    dot.title = 'آنلاین';
  } else {
    dot.classList.add('offline');
    dot.title = 'آفلاین';
  }
}

function formatRel(ms){
  const d = Math.max(0, Date.now() - ms);
  const m = Math.floor(d/60000);
  if (m < 1) return 'لحظه‌ای پیش';
  if (m < 60) return `${dg(m)} دقیقه پیش`;
  const h = Math.floor(m/60);
  if (h < 24) return `${dg(h)} ساعت پیش`;
  return `${dg(Math.floor(h/24))} روز پیش`;
}

async function load(lat, lon, name, region){
  if (loadingInProgress) return;
  loadingInProgress = true;
  current = { lat, lon, name, region: region || '', key: cacheKeyFor(lat, lon) };
  localStorage.setItem(LAST_CITY_KEY, JSON.stringify({ lat, lon, name, region: region || '' }));
  const btn = $('refresh');
  btn.classList.add('spin');
  btn.disabled = true;

  const cached = loadCache(lat, lon);
  if (cached){
    lastWeather = cached.data; lastAqi = cached.aqi; lastSavedAt = cached.at;
    render(cached.data, cached.aqi, name, cached.at, true);
    if (Date.now() - cached.at < 60_000){
      loadingInProgress = false;
      btn.classList.remove('spin'); btn.disabled = false;
      return;
    }
  } else {
    showMessage('در حال دریافت اطلاعات…');
  }

  try {
    const [wRes, aRes] = await Promise.all([
      get(API(lat, lon)),
      get(AQI_API(lat, lon)).catch(() => null)
    ]);
    const aqi = aRes?.current?.european_aqi ?? null;
    const now = Date.now();
    lastWeather = wRes; lastAqi = aqi; lastSavedAt = now;
    offlineMode = false;
    updateStatusDot(true); // آپدیت چراغ وضعیت
    saveCache(lat, lon, wRes, aqi, now);
    render(wRes, aqi, name, now, false);
    startCountdown();
  } catch (err){
    offlineMode = true;
    updateStatusDot(false); // آپدیت چراغ وضعیت
    if (cached){
      updateCountdown();
    } else {
      showMessage('خطا در اتصال. اینترنت را بررسی کنید 📡');
    }
  } finally {
    loadingInProgress = false;
    btn.classList.remove('spin');
    btn.disabled = false;
  }
}

/* ============ Bilingual city search with a real dropdown ============ */
let searchTimer = null;
let searchAbort = null;
let searchSequence = 0;
let selectedSearchIndex = -1;
const searchCache = new Map();
const escapeSearchText = value => String(value ?? '').replace(/[&<>"']/g, ch => ({
  '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
}[ch]));
const normalizeCityQuery = value => String(value || '')
  .normalize('NFKC')
  .replace(/[\u0000-\u001f\u007f]/g, ' ')
  .replace(/\s+/g, ' ')
  .trim()
  .slice(0, 80);
const queryIsPersian = value => /[\u0600-\u06ff]/.test(value);
const cityIdentity = city => city.id != null
  ? 'id:' + city.id
  : 'geo:' + Number(city.latitude).toFixed(4) + ',' + Number(city.longitude).toFixed(4);

function setSearchDropdown(open) {
  const list = $('sug');
  const input = $('q');
  list.hidden = !open;
  input.setAttribute('aria-expanded', open ? 'true' : 'false');
}
function showSearchMessage(message) {
  $('sug').innerHTML = '<li class="empty" role="status">' + escapeSearchText(message) + '</li>';
  selectedSearchIndex = -1;
  setSearchDropdown(true);
}
async function requestCityResults(query, language, signal) {
  const url = GEO_API(query, language);
  const response = await fetch(url, { signal, cache: 'no-store' });
  if (!response.ok) throw new Error('Geocoding HTTP ' + response.status);
  const data = await response.json();
  if (data.error) throw new Error(data.reason || 'Geocoding error');
  return Array.isArray(data.results) ? data.results : [];
}
async function searchCities(query, signal) {
  const normalizedQuery = normalizeCityQuery(query);
  const cacheKey = normalizedQuery.toLocaleLowerCase('fa');
  if (searchCache.has(cacheKey)) return searchCache.get(cacheKey);

  // Query both language indexes on every search. One index can fail or omit
  // translations while the other still has useful matches.
  const languages = queryIsPersian(normalizedQuery) ? ['fa', 'en'] : ['en', 'fa'];
  const responses = await Promise.allSettled(
    languages.map(language => requestCityResults(normalizedQuery, language, signal))
  );
  const successful = responses.filter(result => result.status === 'fulfilled');
  if (!successful.length) {
    const failure = responses.find(result => result.status === 'rejected');
    if (failure && failure.reason) throw failure.reason;
    throw new Error('City search failed');
  }

  const merged = new Map();
  responses.forEach(response => {
    if (response.status !== 'fulfilled') return;
    for (const city of response.value) {
      if (!city || !city.name || !Number.isFinite(city.latitude) || !Number.isFinite(city.longitude)) continue;
      const id = cityIdentity(city);
      const name = String(city.name).trim();
      if (!name) continue;
      const existing = merged.get(id);
      if (!existing) {
        merged.set(id, {
          id: city.id,
          latitude: city.latitude,
          longitude: city.longitude,
          name,
          alternateNames: [],
          country: city.country || '',
          admin1: city.admin1 || '',
          population: Number(city.population) || 0,
          feature_code: city.feature_code || ''
        });
      } else {
        if (name !== existing.name && !existing.alternateNames.includes(name)) {
          existing.alternateNames.push(name);
        }
        if (!existing.country && city.country) existing.country = city.country;
        if (!existing.admin1 && city.admin1) existing.admin1 = city.admin1;
        existing.population = Math.max(existing.population, Number(city.population) || 0);
      }
    }
  });

  const results = [...merged.values()]
    .sort((a,b) => b.population - a.population)
    .slice(0,100);
  if (searchCache.size >= 100) searchCache.delete(searchCache.keys().next().value);
  searchCache.set(cacheKey, results);
  return results;
}
function renderCityResults(results, query) {
  const list = $('sug');
  if (!results.length) {
    showSearchMessage('شهری پیدا نشد؛ نام شهر را دقیق‌تر و فارسی یا انگلیسی وارد کنید');
    return;
  }
  const direction = queryIsPersian(query) ? 'rtl' : 'ltr';
  list.innerHTML = results.map((city, index) => {
    const name = escapeSearchText(city.name);
    const details = escapeSearchText([city.admin1, city.country].filter(Boolean).join('، '));
    const population = city.population ? ' · جمعیت ' + escapeSearchText(fa(city.population)) : '';
    const alternateName = (city.alternateNames || []).find(value => value && value !== city.name);
    const alternate = alternateName
      ? '<span class="r-alt">' + escapeSearchText(alternateName) + '</span>'
      : '';
    return '<li role="option" aria-selected="false" tabindex="-1" data-index="' + index +
      '" data-a="' + city.latitude + '" data-o="' + city.longitude +
      '" data-n="' + name + '" data-r="' + details + '" dir="' + direction + '">' +
      '<span class="r-name">' + name + '</span>' + alternate +
      (details || city.population ? '<span class="r-sub">' + details + population + '</span>' : '') +
      '</li>';
  }).join('');
  selectedSearchIndex = -1;
  setSearchDropdown(true);
}
function selectSearchResult(item) {
  if (!item || !item.dataset.a || !item.dataset.o) return;
  const latitude = Number(item.dataset.a);
  const longitude = Number(item.dataset.o);
  if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) return;
  const name = item.dataset.n || '';
  const region = item.dataset.r || '';
  setSearchDropdown(false);
  $('q').value = '';
  load(latitude, longitude, name, region);
}
function moveSearchSelection(step) {
  const items = [...$('sug').querySelectorAll('li[data-a]')];
  if (!items.length) return;
  selectedSearchIndex = Math.max(0, Math.min(items.length - 1, selectedSearchIndex + step));
  items.forEach((item, index) => {
    item.setAttribute('aria-selected', index === selectedSearchIndex ? 'true' : 'false');
    if (index === selectedSearchIndex) item.scrollIntoView({ block: 'nearest' });
  });
}
$('q').addEventListener('input', event => {
  clearTimeout(searchTimer);
  const query = normalizeCityQuery(event.target.value);
  const sequence = ++searchSequence;
  if (searchAbort) searchAbort.abort();
  if (query.length < 2) {
    $('sug').innerHTML = '';
    setSearchDropdown(false);
    return;
  }
  showSearchMessage('در حال جستجوی شهرها…');
  searchTimer = setTimeout(async () => {
    const controller = new AbortController();
    searchAbort = controller;
    const timeout = setTimeout(() => controller.abort(), 18000);
    try {
      const results = await searchCities(query, controller.signal);
      if (sequence !== searchSequence) return;
      renderCityResults(results, query);
    } catch (error) {
      if (sequence !== searchSequence) return;
      showSearchMessage(error.name === 'AbortError'
        ? 'زمان جستجو تمام شد؛ دوباره تلاش کنید'
        : 'اتصال به سرویس جستجوی شهر برقرار نشد؛ اینترنت را بررسی کنید');
    } finally {
      clearTimeout(timeout);
    }
  }, 250);
});
$('q').addEventListener('keydown', event => {
  if (event.key === 'ArrowDown' && !$('sug').hidden) {
    event.preventDefault(); moveSearchSelection(1);
  } else if (event.key === 'ArrowUp' && !$('sug').hidden) {
    event.preventDefault(); moveSearchSelection(-1);
  } else if (event.key === 'Escape') {
    setSearchDropdown(false);
  } else if (event.key === 'Enter' && !$('sug').hidden) {
    const items = [...$('sug').querySelectorAll('li[data-a]')];
    if (items.length) {
      event.preventDefault();
      selectSearchResult(items[selectedSearchIndex >= 0 ? selectedSearchIndex : 0]);
    }
  }
});
$('sug').addEventListener('click', e => {
  const li = e.target.closest('li[data-a]');
  if (li) selectSearchResult(li);
});
document.addEventListener('click', e => {
  if (!$('searchArea').contains(e.target)) setSearchDropdown(false);
});
$('f').addEventListener('submit', e => {
  e.preventDefault();
  const first = $('sug').querySelector('li[data-a]');
  if (first) selectSearchResult(first);
});
async function useQandilCoordinates(latitude, longitude){
  let placeName = 'موقعیت من';
  let region = 'موقعیت فعلی شما';
  try {
    const reverse = await get(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=${encodeURIComponent(appLang)}`);
    placeName = reverse.city || reverse.locality || reverse.localityInfo?.administrative?.[2]?.name || placeName;
    region = [reverse.principalSubdivision, reverse.countryName].filter(Boolean).join('، ') || region;
  } catch(e) {}
  $('loc').disabled = false;
  $('loc').textContent = '📍';
  load(latitude, longitude, placeName, region);
}
window.onQandilNativeLocation = (lat, lon, accuracy) => useQandilCoordinates(Number(lat), Number(lon));
window.onQandilNativeLocationError = reason => {
  $('loc').disabled = false;
  $('loc').textContent = '📍';
  const message = reason === 'permission'
    ? 'مجوز مکان داده نشد؛ از تنظیمات برنامه دسترسی مکان را فعال کنید.'
    : reason === 'timeout'
      ? 'موقعیت پیدا نشد؛ GPS را روشن کنید و در فضای باز دوباره امتحان کنید.'
      : 'دریافت موقعیت ممکن نشد؛ دوباره تلاش کنید.';
  showToast(message, 'error', 5000);
};
$('loc').onclick = () => {
  if (loadingInProgress) return;
  $('loc').disabled = true;
  $('loc').textContent = '…';
  showToast('در حال دریافت موقعیت…', 'info', 2500);
  try {
    if (window.AndroidBridge && typeof AndroidBridge.requestNativeLocation === 'function') {
      AndroidBridge.requestNativeLocation();
      return;
    }
  } catch(e) {}
  if (!navigator.geolocation) {
    $('loc').disabled = false;
    $('loc').textContent = '📍';
    showToast('موقعیت‌یابی در این دستگاه پشتیبانی نمی‌شود', 'error');
    return;
  }
  navigator.geolocation.getCurrentPosition(
    p => useQandilCoordinates(p.coords.latitude, p.coords.longitude),
    () => {
      $('loc').disabled = false;
      $('loc').textContent = '📍';
      showToast('دسترسی به موقعیت رد شد یا GPS در دسترس نیست', 'error');
    },
    { enableHighAccuracy:true, timeout:20000, maximumAge:60000 }
  );
};
$('refresh').onclick = () => {
  if (loadingInProgress) return;
  load(current.lat, current.lon, current.name, current.region);
};

/* ============ Notifications toggle ============ */
function updateBell(){
  $('bell').classList.toggle('on', notifEnabled);
  $('bell').title = notifEnabled ? 'اعلان فعال — برای خاموش کردن کلیک کنید' : 'فعال‌سازی اعلان بارش';
  if (!notifEnabled){ $('notifBar').hidden = true; $('rainBanner').hidden = true; }
}
$('bell').onclick = async () => {
  notifEnabled = !notifEnabled;
  localStorage.setItem(NOTIF_KEY, notifEnabled ? '1' : '0');
  updateBell();

  if (notifEnabled){
    const actx = getAudioCtx();
    if (actx && actx.state === 'suspended'){ try { await actx.resume(); } catch{} }
    if (notifSupported() && Notification.permission === 'default'){
      try { await Notification.requestPermission(); } catch{}
    }
    showInPageNotification('اعلان‌ها فعال شد ✅', 'از این پس هشدارهای بارش به‌صورت اعلان نمایش داده می‌شوند.', { icon:'🔔', duration:4000 });
    playNotifSound(); // پخش صدا برای تست
    if (lastWeather){
      updateNotifBar(lastWeather);
      checkRainAlert(lastWeather);
    }
  } else {
    showToast('اعلان‌ها خاموش شد', 'info');
  }
};

/* ============ Pull to refresh ============ */
let pullY = 0, pulling = false, pullDist = 0, isRefreshing = false;
const PULL_TH = 70, PULL_MAX = 100;
function updatePull(d){
  const p = $('pull');
  p.classList.add('visible');
  const ready = d >= PULL_TH;
  p.classList.toggle('ready', ready);
  $('pullText').textContent = ready ? 'برای به‌روزرسانی رها کنید' : 'برای به‌روزرسانی بکشید';
}
function hidePull(){
  const p = $('pull');
  if (isRefreshing) return;
  p.classList.remove('visible', 'ready');
}
async function doPullRefresh(){
  isRefreshing = true;
  const p = $('pull');
  p.classList.add('refreshing', 'visible');
  $('pullText').textContent = 'در حال به‌روزرسانی…';
  try { await load(current.lat, current.lon, current.name, current.region); }
  finally {
    setTimeout(() => {
      p.classList.remove('visible', 'ready', 'refreshing');
      $('pullText').textContent = 'برای به‌روزرسانی بکشید';
      isRefreshing = false;
    }, 500);
  }
}
document.addEventListener('touchstart', e => {
  if (isRefreshing || loadingInProgress) return;
  if (window.scrollY > 0) return;
  if (e.touches.length !== 1) return;
  pullY = e.touches[0].clientY; pulling = true; pullDist = 0;
}, { passive:true });
document.addEventListener('touchmove', e => {
  if (!pulling || isRefreshing) return;
  const d = e.touches[0].clientY - pullY;
  if (d > 0 && window.scrollY === 0){
    if (e.cancelable) e.preventDefault();
    pullDist = Math.min(d * 0.55, PULL_MAX);
    updatePull(pullDist);
  } else {
    pulling = false; hidePull();
  }
}, { passive:false });
document.addEventListener('touchend', () => {
  if (!pulling) return;
  pulling = false;
  if (pullDist >= PULL_TH && !isRefreshing) doPullRefresh();
  else hidePull();
  pullDist = 0;
});
document.addEventListener('touchcancel', () => { pulling = false; pullDist = 0; hidePull(); });

/* ============ PWA install ============ */
function setupManifest(){
  try {
    const manifest = {
      name:document.title, short_name:'Qandil',
      description:document.title,
      start_url: location.href, scope:'./', display:'standalone', orientation:'portrait',
      background_color:'#2a6fd6', theme_color:'#2a6fd6', dir:document.documentElement.dir, lang:appLang,
      icons:[
        { src:'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="32" fill="#2a6fd6"/><text x="96" y="132" font-size="104" text-anchor="middle">🌤️</text></svg>'), sizes:'192x192', type:'image/svg+xml', purpose:'any maskable' },
        { src:'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#2a6fd6"/><text x="256" y="340" font-size="260" text-anchor="middle">🌤️</text></svg>'), sizes:'512x512', type:'image/svg+xml', purpose:'any maskable' }
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], { type:'application/manifest+json' });
    const link = document.createElement('link');
    link.rel = 'manifest'; link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
  } catch(e){}
}
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  $('install').hidden = false;
});
$('install').onclick = async () => {
  if (!deferredPrompt) return;
  try {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted'){ $('install').hidden = true; showToast('اپ نصب شد ✅', 'success'); }
  } catch(e){}
  deferredPrompt = null;
};
window.addEventListener('appinstalled', () => {
  $('install').hidden = true;
  deferredPrompt = null;
  showToast('اپ نصب شد ✅', 'success');
});

/* ============ Resize / offline / online ============ */
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(redrawCharts, 150);
});
window.addEventListener('offline', () => {
  offlineMode = true;
  updateStatusDot(false);
  $('countdown').textContent = 'آفلاین';
  $('rainBanner').hidden = true;
});
window.addEventListener('online', () => {
  offlineMode = false;
  updateStatusDot(true);
  if (loadingInProgress) return;
  load(current.lat, current.lon, current.name, current.region);
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && notifEnabled && lastWeather){
    updateNotifBar(lastWeather);
  }
});

/* ============ Init ============ */
setupManifest();
updateBell();
updateStatusDot(navigator.onLine);

// دریافت خودکار آب‌وهوا هنگام باز شدن برنامه
try {
  const savedCity = JSON.parse(localStorage.getItem(LAST_CITY_KEY) || 'null');
  if (savedCity &&
      Number.isFinite(Number(savedCity.lat)) &&
      Number.isFinite(Number(savedCity.lon)) &&
      Math.abs(Number(savedCity.lat)) <= 90 &&
      Math.abs(Number(savedCity.lon)) <= 180) {
    current = {
      lat: Number(savedCity.lat),
      lon: Number(savedCity.lon),
      name: String(savedCity.name || 'پیرانشهر'),
      region: String(savedCity.region || ''),
      key: cacheKeyFor(Number(savedCity.lat), Number(savedCity.lon))
    };
  }
} catch (e) {}

load(current.lat, current.lon, current.name, current.region);

})();
</script>
