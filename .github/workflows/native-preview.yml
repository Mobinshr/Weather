name: Qandil Native preview

on:
  push:
    branches: [native-migration]
    paths:
      - 'native-android/**'
      - '.github/workflows/native-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Restore permanent release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mobin-apps-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mobin-apps-release.jks" >> "$GITHUB_ENV"
      - name: Verify existing Android package identity
        run: |
          set -euo pipefail
          unzip -q -o PiranshahrWeather-GitHub.zip -d "$RUNNER_TEMP/legacy-weather"
          GRADLE_FILE="$(find "$RUNNER_TEMP/legacy-weather/piranshahr-weather-android/app" -maxdepth 1 -type f \\( -name 'build.gradle.kts' -o -name 'build.gradle' \\) | head -n1)"
          test -n "$GRADLE_FILE"
          LEGACY_APP_ID="$(python3 - "$GRADLE_FILE" <<'PY'
          import pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text()
          match = re.search(r'applicationId\\s*(?:=\\s*)?["\\']([^"\\']+)["\\']', text)
          if not match:
              raise SystemExit("Could not read existing app applicationId")
          print(match.group(1))
          PY
          )"
          echo "Existing release applicationId: $LEGACY_APP_ID"
          test "$LEGACY_APP_ID" = "com.example.weather"
          echo "Native app package matches the existing Weather release."
      - name: Build native Qandil APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p native-android :app:assembleRelease
      - name: Verify signed APK identity
        run: |
          set -euo pipefail
          APK="native-android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.example.weather' versionCode='32' versionName='3.6.0'"
      - uses: actions/upload-artifact@v4
        with:
          name: Qandil-Native-Preview
          path: native-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
