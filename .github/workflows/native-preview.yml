name: Qandil Native preview

on:
  push:
    branches: [native-migration]
    paths:
      - 'native-android/**'
      - '.github/workflows/native-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Restore permanent release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mobin-apps-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mobin-apps-release.jks" >> "$GITHUB_ENV"
      - name: Verify existing Android package identity
        run: |
          set -euo pipefail
          unzip -q -o PiranshahrWeather-GitHub.zip -d "$RUNNER_TEMP/legacy-weather"
          python3 - "$RUNNER_TEMP/legacy-weather/piranshahr-weather-android/app" <<'PY'
          import pathlib
          import re
          import sys

          app_dir = pathlib.Path(sys.argv[1])
          candidates = [app_dir / "build.gradle.kts", app_dir / "build.gradle"]
          gradle_file = next((path for path in candidates if path.is_file()), None)
          if gradle_file is None:
              raise SystemExit("Existing Android app Gradle file was not found")

          source = gradle_file.read_text(encoding="utf-8")
          match = re.search(r"""applicationId\s*(?:=\s*)?["']([^"']+)["']""", source)
          if match is None:
              raise SystemExit("Could not read existing app applicationId")

          legacy_id = match.group(1)
          expected_id = "com.example.weather"
          print(f"Existing release applicationId: {legacy_id}")
          if legacy_id != expected_id:
              raise SystemExit(
                  f"Native app ID mismatch: legacy={legacy_id}, native={expected_id}"
              )
          print("Native app package matches the existing Weather release.")
          PY
      - name: Build native Qandil APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p native-android :app:assembleRelease
      - name: Verify signed APK identity
        run: |
          set -euo pipefail
          APK="native-android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.example.weather' versionCode='32' versionName='3.6.0'"
      - uses: actions/upload-artifact@v4
        with:
          name: Qandil-Native-Preview
          path: native-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
