name: Build Native Qandil Weather APK

on:
  push:
    branches: [main]
    paths:
      - 'native-android/**'
      - 'package.json'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

concurrency:
  group: qandil-weather-native-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and test weather core
        run: |
          npm install --no-audit --no-fund --no-package-lock
          npm run build:core
          npm run test:core
          npm run test:city-search
          npm run test:runtime

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Restore permanent release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mobin-apps-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mobin-apps-release.jks" >> "$GITHUB_ENV"

      - name: Build native Qandil APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p native-android :app:assembleRelease

      - name: Apply V1 and V2 signatures using apksigner
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK="native-android/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$ANDROID_KEYSTORE_PATH" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --min-sdk-version 23 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$RUNNER_TEMP/qandil-dual-signed.apk" \
            "$APK"
          mv "$RUNNER_TEMP/qandil-dual-signed.apk" "$APK"

      - name: Verify APK identity and both signing schemes
        run: |
          set -euo pipefail
          APK="native-android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          VERIFY_OUTPUT="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs --min-sdk-version 23 "$APK" 2>&1)"
          echo "$VERIFY_OUTPUT"
          grep -F "Verified using v1 scheme (JAR signing): true" <<< "$VERIFY_OUTPUT"
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" <<< "$VERIFY_OUTPUT"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.example.weather' versionCode='40' versionName='3.6.8'"

      - uses: actions/upload-artifact@v4
        with:
          name: Qandil-Native-APK
          path: native-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish versioned Native APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.6.8
          name: Qandil Weather v3.6.8 (Native · legacy V1 + V2 signatures)
          body: |
            ## آب‌وهوای قندیل 3.6.8

            نسخهٔ عیب‌یابی قندیل با سازگاری بیشتر برای نصب‌کننده‌های اندرویدی.

            - Package: com.example.weather
            - Version code: 39
            - Kotlin + Jetpack Compose
            - APK پس از ساخت با apksigner دوباره با امضای V1 و V2 امضا و هر دو امضا به‌صورت اجباری بررسی می‌شوند.
            - ثبت خطاهای بسته‌شدن ناگهانی و نمایش گزارش قابل کپی در اجرای بعدی
            - طراحی کلاسیک، پیش‌بینی‌ها، نمودارها و هشدار بارش
          files: native-android/app/build/outputs/apk/release/app-release.apk
          make_latest: true
          fail_on_unmatched_files: true
