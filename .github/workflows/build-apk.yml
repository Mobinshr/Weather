name: Build Native Qandil Weather APK

on:
  push:
    branches: [main]
    paths:
      - 'native-android/**'
      - 'package.json'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

concurrency:
  group: qandil-weather-native-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and test weather core
        run: |
          npm install --no-audit --no-fund --no-package-lock
          npm run build:core
          npm run test:core
          npm run test:city-search
          npm run test:runtime

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Restore permanent release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mobin-apps-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mobin-apps-release.jks" >> "$GITHUB_ENV"

      - name: Build native Qandil APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p native-android :app:assembleRelease

      - name: Verify APK identity and signature
        run: |
          set -euo pipefail
          APK="native-android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.example.weather' versionCode='34' versionName='3.6.2'"

      - uses: actions/upload-artifact@v4
        with:
          name: Qandil-Native-APK
          path: native-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish versioned Native APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.6.2
          name: Qandil Weather v3.6.2 (Native · Classic layout + crash diagnostics)
          body: |
            ## آب‌وهوای قندیل 3.6.2

            رابط Native با بازگردانی چیدمان و امکانات نسخهٔ قبلی قندیل.

            - Package: com.example.weather
            - Version code: 34
            - Kotlin + Jetpack Compose
            - ثبت خطاهای بسته‌شدن ناگهانی و نمایش گزارش قابل کپی در اجرای بعدی
            - دو نمودار دمایی و احتمال بارش ۲۴ ساعت آینده
            - پیش‌بینی ساعتی و هفت‌روزه، کارت‌های UV، طلوع/غروب، باد، حس واقعی، رطوبت، بارش، کیفیت هوا و فشار
            - پس‌زمینهٔ پویا بر اساس هوا و شب/روز
            - کش محلی، تازه‌سازی خودکار و هشدار بارش
          files: native-android/app/build/outputs/apk/release/app-release.apk
          make_latest: true
          fail_on_unmatched_files: true
